<!--
  DonutNV "we're back online" email. Send via Resend to affected/waiting users
  once the system recovers. Table-based + inline styles for email-client safety.
  Subject line to set: We're back, the shop's open again
  Swap https://donutnvapp.com/ in the button href for the exact return destination if needed.
-->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#FFF4EC;padding:32px 0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="460" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.08);overflow:hidden;">
        <tr>
          <td align="center" style="padding:34px 28px 6px;">
            <img src="https://donutnvapp.com/brand/logo-white.png" width="190" alt="DonutNV" style="display:block;width:190px;max-width:72%;height:auto;" />
          </td>
        </tr>
        <tr>
          <td style="padding:14px 34px 8px;text-align:center;">
            <h1 style="margin:0 0 8px;font-size:23px;color:#231F20;">We're back, and the shop's open</h1>
            <p style="margin:0 0 18px;font-size:15px;line-height:1.55;color:#5b5654;">
              Thanks for hanging with us while we glazed things back together. Everything's running sweet again and right where you left it.
            </p>
            <div style="margin:2px 0 20px;">
              <a href="https://donutnvapp.com/" style="display:inline-block;background:#DD1B22;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 30px;border-radius:12px;">Pick up where you left off</a>
            </div>
            <p style="margin:0 0 4px;font-size:13px;line-height:1.5;color:#8a8482;">
              Sorry for the short break. Sweet things are worth the wait.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:18px 28px 26px;border-top:1px solid #f1ece9;text-align:center;">
            <p style="margin:0;font-size:12px;color:#a8a2a0;">
              DonutNV &bull; Make Your Next Party Sweet!&reg;
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
